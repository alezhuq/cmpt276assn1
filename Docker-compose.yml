services:
  # Your custom Maven container

  maven-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maven-app
    depends_on:
      - postgres-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/app_db
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_password
    volumes:
      - .:/app                 # Mounts your project source code into the container
      - maven-repo:/root/.m2   # Caches your Maven dependencies between runs
    working_dir: /app
    command: mvn spring-boot:run # Adjust this command based on your project goals
    networks:
      - app-network
    ports:
      - "8080:8080"

  # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres-data:
  maven-repo:

networks:
  app-network:
    driver: bridge